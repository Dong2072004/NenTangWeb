<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Playground</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>

    <header class="fixed-header">
        <div class="logo">MyLogo</div>
        <nav class="navigation">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="main-layout">
        
        <aside class="sticky-sidebar">
            <h3>Danh mục</h3>
            <ul>
                <li><a href="#">Điện thoại</a></li>
                <li><a href="#">Laptop</a></li>
                <li><a href="#">Phụ kiện</a></li>
            </ul>
        </aside>

        <main class="content-area">
            <h2>Sản phẩm nổi bật</h2>
            <div class="product-grid">
                
                <div class="product-card">
                    <span class="badge-hot">HOT</span>
                    <div class="product-image"></div>
                    <div class="product-info">
                        <h4>iPhone 15 Pro Max</h4>
                        <p class="price">29.990.000 đ</p>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image"></div>
                    <div class="product-info">
                        <h4>MacBook Air M3</h4>
                        <p class="price">27.490.000 đ</p>
                    </div>
                </div>
                
                <div class="product-card">
                    <div class="product-image"></div>
                    <div class="product-info">
                        <h4>iPad Pro M4</h4>
                        <p class="price">25.990.000 đ</p>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image"></div>
                    <div class="product-info">
                        <h4>Apple Watch Ultra 2</h4>
                        <p class="price">21.490.000 đ</p>
                    </div>
                </div>

            </div>
            <div class="spacer">Khu vực cuộn trang giả lập...</div>
        </main>
    </div>

    <button class="scroll-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">
        ↑
    </button>

</body>
</html>
